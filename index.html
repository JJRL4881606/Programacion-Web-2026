<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Proyecto de programación web, desarrollo de página web de compras de videojuegos online.">
    <meta name="author" content="Josué Eleazar Burgos Urías, Marcos Uriel Castro Perales">
    <meta name="keywords" content="html, proyecto, página web">

    <meta property="og:title" content="Inicio - GameZone">
    <meta property="og:description" content="Proyecto de programación web">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jjrl4881606.github.io/Programacion-Web-2026/index.html">
    <meta property="og:image" content="https://jjrl4881606.github.io/Programacion-Web-2026/assets/img/logo.webp">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/webp" href="assets/icons/favicon.webp">

    <title>Inicio - GameZone | Página de compra de videojuegos online</title>

    <link rel="canonical" href="index.html">
    <meta name="robots" content="index, follow">
    <link rel="alternate" hreflang="es" href="index.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1 class="logo">
            <a href="index.html">
                <img src="assets/img/logo.webp" alt="GameZone" width="320" height="80">
            </a>
        </h1>

        <form role="search" action="pages/search.html" method="get">
            <input type="search" id="buscar" name="buscar" placeholder="Buscar juegos" aria-label="Buscar juegos">
            <button type="submit" aria-label="Buscar">
                <img src="assets/icons/icon-search.webp" alt="" width="20" height="20">
            </button>
        </form>

        <nav aria-label="Cuenta y compras">
            <a href="pages/cart.html">
                <img src="assets/icons/icon-cart.webp" alt="" width="20" height="20">
                Carrito
            </a>

            <a href="pages/profile.html">
                <img src="assets/icons/icon-profile.webp" alt="" width="20" height="20">
                Perfil
            </a>

            <button type="button" id="btn-tema" class="btn-header">Cambiar modo</button>
        </nav>
        
        <button type="button" id="btn-menu" class="btn-header btn-menu" aria-label="Abrir menú">☰ Menú</button>

        <nav id="menu" aria-label="Categorías y ofertas">
            <a href="index.html">
                <img src="assets/icons/icon-home.webp" alt="" width="20" height="20">
                Inicio
            </a>

            <a href="pages/categories.html">
                <img src="assets/icons/icon-categories.webp" alt="" width="20" height="20">
                Categorías
            </a>

            <a href="pages/sales.html">
                <img src="assets/icons/icon-sales.webp" alt="" width="20" height="20">
                Ofertas
            </a>
        </nav>
    </header>

    <main>
        <section>
            <article class="destacado">
                <div class="destacado__cuerpo">
                    <img class="destacado__imagen" src="assets/img/minecraft.jpg" alt="Minecraft-IMG-Principal" width="500" height="250">

                    <div class="destacado__texto">
                        <h2 class="destacado__titulo">Minecraft</h2>

                        <div class="destacado__info">
                            <p class="precio precio--destacado"><strong>$800.00</strong></p>
                            <a class="boton" href="pages/game.html" aria-label="Ver detalles de Minecraft">Ver detalles</a>
                        </div>

                        <ul class="etiquetas">
                            <li><a href="pages/category.html">Casual</a></li>
                            <li><a href="pages/category.html">Construcción</a></li>
                            <li><a href="pages/category.html">Exploración</a></li>
                        </ul>
                    </div>
                </div>

                <div class="galeria">
                    <img src="assets/img/minecraftS1.jpg" alt="Minecraft-Imagen-Secundaria-1" width="300" height="150" loading="lazy">
                    <img src="assets/img/minecraftS2.jpg" alt="Minecraft-Imagen-Secundaria-2" width="300" height="150" loading="lazy">
                    <img src="assets/img/minecraftS3.jpg" alt="Minecraft-Imagen-Secundaria-3" width="300" height="150" loading="lazy">
                    <img src="assets/img/minecraftS4.jpg" alt="Minecraft-Imagen-Secundaria-4" width="300" height="150" loading="lazy">
                </div>
            </article>
        </section>

        <section>
            <h2>Catálogo de juegos</h2>
                <p id="estado-catalogo" role="status">Cargando juegos…</p>
                <div class="catalogo" id="catalogo"></div>
        </section>
    </main>

    <footer>
        <p>Versión <strong>1.0.0</strong></p>
        <p>(C) 2026 GameZone. Todos los derechos reservados.</p>
    </footer>

    <template id="tpl-juego">
        <article class="juego">
            <img class="juego__imagen" alt="" width="300" height="300" loading="lazy">

            <div class="juego__info">
                <h3></h3>
                <p class="precio"><strong></strong></p>

                <div class="juego__acciones">
                    <a class="boton" href="pages/game.html">Ver detalles</a>
                    <button type="button" class="favorito" data-accion="favorito" aria-pressed="false">♡</button>
                </div>
            </div>
        </article>
    </template>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
