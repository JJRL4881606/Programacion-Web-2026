<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/assets/icons/favicon.webp">
    <title>Carrito - GameZone</title>
</head>

<body>
    <header>
        <img src="/assets/img/logo.webp" alt="" width="320" height="80">

        <nav>
            <ul>
                <li><a href="/pages/categories.html"><img src="/assets/icons/icon-categories.webp" alt="" width="20" height="20"> Categorías</a></li>
                <li><a href="/pages/sales.html"><img src="/assets/icons/icon-sales.webp" alt="" width="20" height="20"> Ofertas</a></li>
            </ul>
        </nav>

        <img src="/assets/icons/icon-search.webp" alt="" width="18" height="18">
        <label for="buscar">Buscar videojuegos</label>
        <input type="search" id="buscar" name="buscar" placeholder="Buscar videojuegos">
        <nav>
            <ul>
                <li><a href="/index.html"><img src="/assets/icons/icon-catalog.webp" alt="" width="20" height="20"> Catálogo</a></li>
                <li><a href="/pages/cart.html"><img src="/assets/icons/icon-cart.webp" alt="" width="20" height="20"> Carrito</a></li>
                <li><a href="/pages/profile.html"><img src="/assets/icons/icon-profile.webp" alt="" width="20" height="20"> Perfil</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h1>Carrito</h1>

        <section>
            <h2>Productos en tu carrito</h2>

            <div>
                <img src="/assets/img/minecraft-2.jpg" alt="Minecraft" width="100" height="100">
                <h3>Minecraft</h3>
                <p><strong>$800.00</strong></p>
                <label for="cantidad-minecraft">Cantidad</label>
                <input type="number" id="cantidad-minecraft" name="cantidad-minecraft" value="1" min="1">
                <button type="button">Eliminar</button>
            </div>

            <div>
                <img src="/assets/img/human-fall-flat.jpg" alt="Human Fall Flat" width="100" height="100">
                <h3>Human Fall Flat</h3>
                <p><strong>$200.00</strong></p>
                <label for="cantidad-hff">Cantidad</label>
                <input type="number" id="cantidad-hff" name="cantidad-hff" value="1" min="1">
                <button type="button">Eliminar</button>
            </div>
        </section>

        <section>
            <h2>Resumen de compra</h2>
            <p>Subtotal: <strong>$1,000.00</strong></p>
            <button type="button">Proceder al pago</button>
        </section>
    </main>

    <footer>
        <p>Versión <strong>1.0.0</strong></p>
        <p>(C) 2026 GameZone. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
