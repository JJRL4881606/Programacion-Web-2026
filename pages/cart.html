<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Proyecto de programación web, desarrollo de página web de compras de videojuegos online.">
    <meta name="author" content="Josué Eleazar Burgos Urías, Marcos Uriel Castro Perales">
    <meta name="keywords" content="html, proyecto, página web">

    <meta property="og:title" content="Inicio - GameZone">
    <meta property="og:description" content="Proyecto de programación web">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jjrl4881606.github.io/Programacion-Web-2026/index.html">
    <meta property="og:image" content="https://jjrl4881606.github.io/Programacion-Web-2026/assets/img/logo.webp">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/webp" href="../assets/icons/favicon.webp">

    <title>Carrito - GameZone</title>

    <link rel="canonical" href="index.html">
    <meta name="robots" content="index, follow">
    <link rel="alternate" hreflang="es" href="index.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <h1 class="logo">
            <a href="../index.html">
                <img src="../assets/img/logo.webp" alt="GameZone" width="320" height="80">
            </a>
        </h1>

        <form role="search" action="#">
            <input type="search" id="buscar" name="buscar" placeholder="Buscar juegos" aria-label="Buscar juegos">
            <button type="submit" aria-label="Buscar">
                <img src="../assets/icons/icon-search.webp" alt="" width="20" height="20">
            </button>
        </form>

        <nav aria-label="Cuenta y compras">
            <a href="../pages/cart.html">
                <img src="../assets/icons/icon-cart.webp" alt="" width="20" height="20">
                Carrito
            </a>

            <a href="../pages/profile.html">
                <img src="../assets/icons/icon-profile.webp" alt="" width="20" height="20">
                Perfil
            </a>
        </nav>

        <nav aria-label="Categorías y ofertas">
            <a href="../index.html">
                <img src="../assets/icons/icon-home.webp" alt="" width="20" height="20">
                Inicio
            </a>

            <a href="../pages/categories.html">
                <img src="../assets/icons/icon-categories.webp" alt="" width="20" height="20">
                Categorías
            </a>

            <a href="../pages/sales.html">
                <img src="../assets/icons/icon-sales.webp" alt="" width="20" height="20">
                Ofertas
            </a>
        </nav>
    </header>

    <main>
        <h2 class="titulo-pagina">Productos en tu carrito</h2>

        <div class="carrito">
            <section class="lista-carrito">
                <div class="producto">
                    <img src="../assets/img/minecraft-2.jpg" alt="Minecraft" width="100" height="100">

                    <div class="info-producto">
                        <h3>Minecraft</h3>
                        <p class="precio">$800.00</p>
                    </div>

                    <div class="acciones-producto">
                        <label for="cantidad-minecraft">Cantidad</label>
                        <input type="number" id="cantidad-minecraft" name="cantidad-minecraft" value="1" min="1">
                        <button type="button" class="boton boton-secundario" aria-label="Eliminar Minecraft del carrito">Eliminar</button>
                    </div>
                </div>

                <div class="producto">
                    <img src="../assets/img/human-fall-flat.jpg" alt="Human Fall Flat" width="100" height="100">

                    <div class="info-producto">
                        <h3>Human Fall Flat</h3>
                        <p class="precio">$200.00</p>
                    </div>

                    <div class="acciones-producto">
                        <label for="cantidad-hff">Cantidad</label>
                        <input type="number" id="cantidad-hff" name="cantidad-hff" value="1" min="1">
                        <button type="button" class="boton boton-secundario" aria-label="Eliminar Human Fall Flat del carrito">Eliminar</button>
                    </div>
                </div>
            </section>

            <section class="tarjeta resumen">
                <h2>Resumen de compra</h2>
                <p>Subtotal: <strong class="precio">$1,000.00</strong></p>
                <button type="button" class="boton">Proceder al pago</button>
            </section>
        </div>
    </main>
    
    <footer>
        <p>Versión <strong>1.0.0</strong></p>
        <p>(C) 2026 GameZone. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
